<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفكرة كنيسة الملاك ميخائيل الروحية</title>
    <style>
        :root {
            --church-purple: #4a154b;
            --gold: #d4af37;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --success: #2ecc71;
            --primary-blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }

        .church-logo { font-size: 40px; margin-bottom: 5px; }
        header h1 { margin: 0; font-size: 24px; color: var(--church-purple); }
        .subtitle { margin: 5px 0 0; color: #718096; font-size: 14px; font-weight: 500; }

        .user-info-section {
            background: #f7fafc;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .input-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .input-group label { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: var(--church-purple); }
        .input-group input, .input-group select { padding: 12px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 15px; outline: none; }

        .progress-section {
            background: #fffaf0; border: 1px solid #feebc8; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px;
        }

        .progress-bar-container { background: #edf2f7; border-radius: 10px; height: 14px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { background: linear-gradient(90deg, var(--church-purple), var(--success)); width: 0%; height: 100%; transition: width 0.3s ease; }
        .progress-text { margin: 0; font-weight: bold; font-size: 14px; }
        #progressPercent { color: var(--success); }

        .section-title { font-size: 16px; color: var(--church-purple); margin-bottom: 12px; font-weight: bold; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 15px; background: white; }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #edf2f7; font-size: 14px; vertical-align: middle; }
        th { background: var(--church-purple); color: white; font-weight: 600; white-space: nowrap; }

        .tracker-checkbox { width: 22px; height: 22px; cursor: pointer; accent-color: var(--church-purple); }

        .actions-section { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }

        .btn-submit { background: var(--primary-blue); color: white; }
        .btn-share { background: var(--success); color: white; }
        .btn-reset { background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; padding: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="church-logo">⛪</div>
            <h1>كنيسة الملاك ميخائيل</h1>
            <p class="subtitle">المفكرة الروحية الأسبوعية</p>
        </header>

        <div class="user-info-section">
            <div class="input-group">
                <label for="userName">إسم الخادم / المخدوم:</label>
                <input type="text" id="userName" placeholder="اكتب اسمك الثلاثي هنا...">
            </div>
            <div class="input-group">
                <label for="weekSelect">تحديد الأسبوع:</label>
                <select id="weekSelect">
                    <option value="الأسبوع الأول">الأسبوع الأول</option>
                    <option value="الأسبوع الثاني">الأسبوع الثاني</option>
                    <option value="الأسبوع الثالث">الأسبوع الثالث</option>
                    <option value="الأسبوع الرابع">الأسبوع الرابع</option>
                </select>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p class="progress-text">نسبة الإنجاز الإجمالية للأسبوع: <span id="progressPercent">0%</span></p>
        </div>

        <div class="weekly-tracker">
            <h3 class="section-title">📊 جدول المتابعة اليومية</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>اليوم</th>
                            <th>باكر</th>
                            <th>النوم</th>
                            <th>كتاب مقدس</th>
                            <th>التناول</th>
                            <th>الاجتماع</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">السبت</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الأحد</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الإثنين</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الثلاثاء</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الأربعاء</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الخميس</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                        <tr>
                            <td style="font-weight: bold; background: #f7fafc;">الجمعة</td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="matins"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="sleeping"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="bible"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="communion"></td>
                            <td><input type="checkbox" class="tracker-checkbox" data-activity="meeting"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="actions-section">
            <button class="btn-submit" id="submitBtn">حفظ وإرسال البيانات</button>
            <button class="btn-reset" id="resetBtn">إعادة ضبط</button>
        </div>
    </div>

    <script>
        // توزيع النسبة المئوية على الأنشطة (إجمالي الإنجاز = 100%):
        // باكر (إجمالي 30.5%) -> 30.5 / 7 أيام ≈ 4.357% لكل يوم
        // النوم (إجمالي 30.5%) -> 30.5 / 7 أيام ≈ 4.357% لكل يوم
        // كتاب مقدس (إجمالي 30.5%) -> 30.5 / 7 أيام ≈ 4.357% لكل يوم
        // التناول (إجمالي 4.35%) -> 4.35 / 7 أيام ≈ 0.621% لكل يوم
        // الاجتماع (إجمالي 4.35%) -> 4.35 / 7 أيام ≈ 0.621% لكل يوم

        const WEIGHTS = {
            matins: 30.5 / 7,
            sleeping: 30.5 / 7,
            bible: 30.5 / 7,
            communion: 4.35 / 7,
            meeting: 4.35 / 7
        };

        const checkboxes = document.querySelectorAll('.tracker-checkbox');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');

        function updateProgress() {
            let totalProgress = 0;

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const activity = cb.getAttribute('data-activity');
                    if (WEIGHTS[activity]) {
                        totalProgress += WEIGHTS[activity];
                    }
                }
            });

            // تقريب النسبة لأقرب رقمين عشريين
            const finalPercent = Math.min(Math.round(totalProgress * 100) / 100, 100);
            
            progressBar.style.width = `${finalPercent}%`;
            progressPercent.innerText = `${finalPercent}%`;
        }

        checkboxes.forEach(cb => {
            cb.addEventListener('change', updateProgress);
        });

        submitBtn.addEventListener('click', () => {
            const userName = document.getElementById('userName').value.trim();
            const week = document.getElementById('weekSelect').value;
            const percent = progressPercent.innerText;

            if (!userName) {
                alert('يرجى كتابة اسمك أولاً!');
                return;
            }

            alert(`تم حفظ البيانات بنجاح!\nالاسم: ${userName}\nالفترة: ${week}\nنسبة الإنجاز: ${percent}`);
        });

        resetBtn.addEventListener('click', () => {
            if (confirm('هل أنت تأكد من إعادة ضبط جميع الإدخالات؟')) {
                checkboxes.forEach(cb => cb.checked = false);
                document.getElementById('userName').value = '';
                updateProgress();
            }
        });
    </script>
</body>
</html>
